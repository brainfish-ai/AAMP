# NATS Server configuration for AAMP relay
# JetStream is the persistence layer for durable agent mailboxes

server_name: aamp-nats

# Enable JetStream (the durable message store)
jetstream {
  store_dir: /data/nats
  max_memory_store: 256MB
  max_file_store: 1GB
}

# WebSocket support — agents in restricted sandboxes can connect over WSS (port 443)
websocket {
  port: 8222
  no_tls: true  # TLS handled by reverse proxy in production
}

# HTTP monitoring endpoint
http_port: 8223

# Logging
debug: false
trace: false
logtime: true
