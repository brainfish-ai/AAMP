name            = "aamp-demo-ui"
compatibility_date  = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[vars]
RELAY_A_URL    = "https://aamp-relay-a.YOUR_SUBDOMAIN.workers.dev"
RELAY_B_URL    = "https://aamp-relay-b.YOUR_SUBDOMAIN.workers.dev"
# FINANCE_IMAGE and RESEARCH_IMAGE default to Docker Hub tags in the API route

# Durable Object binding for Cloudflare Sandbox
# The Sandbox class is exported from the start API route worker bundle.
[[durable_objects.bindings]]
name       = "SANDBOX"
class_name = "Sandbox"

# Migrations must be listed when adding new Durable Object classes.
[[migrations]]
tag             = "v1"
new_classes     = ["Sandbox"]

# Secrets (set via wrangler pages secret put):
#   NATS_URL     — wss:// endpoint from Synadia Cloud
#   NATS_CREDS   — NKey seed from Synadia Cloud
