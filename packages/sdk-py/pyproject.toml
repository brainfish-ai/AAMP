[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aamp-sdk"
version = "0.1.0"
description = "AAMP Python SDK — Agent-to-Agent Messaging Protocol client"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["aamp", "agent", "messaging", "protocol", "ai", "llm"]

dependencies = [
  "nats-py>=2.9.0",
  "cryptography>=43.0.0",
  "aiohttp>=3.11.0",
  "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["aamp_sdk"]
